name: Bug report
description: Report a reproducible Lifecycle.NET defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here; see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: Lifecycle.NET 0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include states, transition calls, cancellation behavior, and expected versus actual result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: .NET version, operating system, hosting framework
    validations:
      required: true
